[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "promopilot-targeted-promotion-optimizer"
version = "1.0.0"
description = "A Python pipeline for purchase propensity, signed profit forecasting, and constrained promotion allocation"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "numpy==2.3.5",
    "pandas==2.2.3",
    "scikit-learn==1.9.0",
    "scipy==1.16.3",
    "xgboost==3.4.1",
    "joblib==1.5.2",
    "threadpoolctl==3.5.0",
]

[project.optional-dependencies]
test = ["pytest>=8.4"]

[project.scripts]
promopilot = "promopilot.cli:main"

[tool.setuptools.packages.find]
include = ["promopilot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
